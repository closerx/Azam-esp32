<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع عزم - لوحة التحكم</title>
    <!-- استدعاء مكتبة MQTT ومكتبات التصميم والأيقونات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00b4d8;
            --secondary: #0077b6;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #00f5d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.3);
            transition: all 0.4s;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* منطقة الأنميشن والكرة */
        .visual-container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 250px;
        }

        .ball-icon {
            font-size: 120px;
            color: #64748b;
            transition: all 0.2s ease;
        }

        /* تأثير الحركة والضغط */
        .ball-icon.pressing {
            color: #00f5d4;
            transform: scale(0.85);
            filter: drop-shadow(0 0 25px rgba(0, 245, 212, 0.6));
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s, border-color 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card h3 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .value {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text);
            font-family: monospace;
        }

        #powerDisplay { color: #38bdf8; }
        #repsDisplay { color: #a78bfa; }
    </style>
</head>
<body>

    <div class="header">
        <h1>عزم</h1>
        <p>منظومة التأهيل الذكي لليد والكرة العلاجية</p>
        <div id="status" class="status-badge">
            <i class="fas fa-circle-notch fa-spin"></i> جاري الاتصال بالسيرفر السحابي..
        </div>
    </div>

    <div class="main-container">
        
        <!-- الحاوية المرئية للكرة التفاعلية -->
        <div class="visual-container">
            <div id="ballVisual" class="ball-icon">
                <i class="fas fa-circle"></i> 
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3><i class="fas fa-bolt" style="color: #38bdf8;"></i> القوة الحالية</h3>
                <div id="powerDisplay" class="value">0%</div>
            </div>

            <div class="card">
                <h3><i class="fas fa-redo-alt" style="color: #a78bfa;"></i> عدد التكرارات</h3>
                <div id="repsDisplay" class="value">0</div>
            </div>
        </div>
        
    </div>

    <script>
        // الإعدادات الجديدة المحدثة لسيرفر HiveMQ Cloud الخاص بك
        var broker = "c9fd45809c6e4d5787a6c3caec263b77.s1.eu.hivemq.cloud";
        var port = 8884; // منفذ الـ WebSockets المشفر والإجباري في خوادم HiveMQ السحابية
        var clientId = "web_azm_" + parseInt(Math.random() * 10000, 10);
        
        // بيانات الحساب الخاص بك للتصريح بالدخول
        var mqtt_user = "hivemq.webclient.1778874002499";
        var mqtt_pass = "HC$9dtDeT,Zw>5:3Sb8r";

        var client = new Paho.MQTT.Client(broker, Number(port), clientId);
        var statusBadge = document.getElementById("status");
        var ballVisual = document.getElementById("ballVisual");

        // دالة استقبال الرسائل وتحديث البيانات والرسومات
        client.onMessageArrived = function(message) {
            if(message.destinationName === "healthball/patient1/power") {
                var powerValue = parseInt(message.payloadString, 10) || 0;
                document.getElementById("powerDisplay").innerText = powerValue + "%";
                
                // منطق تغيير شكل وحالة الكرة التفاعلية بناءً على القوة الحالية
                if(powerValue > 0) {
                    ballVisual.innerHTML = '<i class="fas fa-hand-fist"></i>';
                    ballVisual.className = "ball-icon pressing";
                } else {
                    ballVisual.innerHTML = '<i class="fas fa-circle"></i>';
                    ballVisual.className = "ball-icon";
                }
            }
            
            if(message.destinationName === "healthball/patient1/reps") {
                document.getElementById("repsDisplay").innerText = message.payloadString;
            }
        };

        // إدارة انقطاع الاتصال وإعادة المحاولة
        client.onConnectionLost = function(responseObject) {
            statusBadge.className = "status-badge";
            statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> انقطع الاتصال، جاري المحاولة..';
            setTimeout(connectMQTT, 3000);
        };

        // دالة بدء الاتصال والاشتراك بالقنوات مع تفعيل خيارات الأمان والـ SSL
        function connectMQTT() {
            var options = {
                useSSL: true, // تفعيل التشفير والاتصال الآمن WSS
                userName: mqtt_user,
                password: mqtt_pass,
                onSuccess: function() {
                    statusBadge.className = "status-badge connected";
                    statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> متصل بالسيرفر السحابي عزم';
                    client.subscribe("healthball/patient1/power");
                    client.subscribe("healthball/patient1/reps");
                },
                onFailure: function(message) {
                    console.log("Connection failed: " + message.errorMessage);
                    statusBadge.className = "status-badge";
                    statusBadge.innerHTML = '<i class="fas fa-times-circle"></i> فشل الاتصال، جاري إعادة المحاولة..';
                    setTimeout(connectMQTT, 5000);
                }
            };
            
            client.connect(options);
        }

        // تشغيل الاتصال تلقائياً عند فتح الصفحة
        connectMQTT();
    </script>
</body>
</html>
